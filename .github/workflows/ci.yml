name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: aisle }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aisle
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aisle_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123
      BETTER_AUTH_URL: http://localhost:3000
      DATA_PROVIDER: demo
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit, component and integration tests
        run: pnpm test
      - name: Integration tests without Redis (free-hosting mode)
        run: pnpm vitest run --project integration
        env: { REDIS_URL: "" }
      - name: Migrate and seed demo data
        run: pnpm db:migrate && pnpm db:seed
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (production server)
        run: |
          pnpm start &
          npx --yes wait-on http://localhost:3000/sign-in
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
