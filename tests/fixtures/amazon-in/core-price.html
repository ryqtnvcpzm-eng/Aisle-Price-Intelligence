<!doctype html><html><head><title>Amazon.in</title></head><body>
<!-- Modern layout: price in the core price block, size and flavour twisters, a deal badge. Fictional product. -->
<input type="hidden" id="ASIN" name="ASIN" value="B0FIXT0001">
<span id="productTitle" class="a-size-large product-title-word-break">
        Fixture Nutrition Plant Protein Powder, Chocolate, 1 kg
</span>
<div id="dealBadge_feature_div"><span class="a-badge-text">Limited time deal</span></div>
<div id="corePrice_feature_div">
  <span class="a-price aok-align-center" data-a-size="xl"><span class="a-offscreen">₹1,299.00</span><span aria-hidden="true"><span class="a-price-symbol">₹</span><span class="a-price-whole">1,299</span></span></span>
</div>
<div class="a-section"><span class="a-price a-text-price" data-a-strike="true"><span class="a-offscreen">₹1,999.00</span></span></div>
<div id="variation_size_name"><label class="a-form-label">Size: </label><span class="selection">1 kg</span></div>
<div id="variation_flavor_name"><label class="a-form-label">Flavour Name: </label><span class="selection">Chocolate</span></div>
<div id="availability" class="a-section a-spacing-base"><span class="a-size-medium a-color-success">
   In stock
</span></div>
</body></html>
